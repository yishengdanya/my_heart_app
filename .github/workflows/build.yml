name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用 Kivy 官方构建 Action，它会自动配置环境、缓存，且不会吃额外费用！
      - name: Build with Buildozer
        uses: kivy/buildozer-action@v3
        with:
          python-version: '3.10'    # 强制锁定 Python 3.10，这是编译成功的关键！
          buildozer-args: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk