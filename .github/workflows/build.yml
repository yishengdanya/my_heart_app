name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest          # 改用 ubuntu-latest，避免 runner 短缺
    timeout-minutes: 30            # 限制构建时长，防止无限排队
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true    # 新提交自动取消旧构建，释放队列
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --user --upgrade buildozer cython==3.0.10
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk